# Builds an unsigned SiteScan.ipa on GitHub's macOS runners, so no Mac is needed.
# Download the artifact from the Actions run, then sideload it from Windows with
# Sideloadly / AltStore using your own Apple ID (see README → 没有 Mac 的做法).
name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project SiteScan.xcodeproj \
            -scheme SiteScan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: |BUILD " || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package .ipa
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../SiteScan-unsigned.ipa Payload)
          ls -la SiteScan-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SiteScan-unsigned-ipa
          path: SiteScan-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
